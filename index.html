<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>択一問題システム (設定保持＆CSV編集強化)</title>
<!-- 設定ファイルの読み込み -->
<script src="config.js"></script>
<!-- ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: "Noto Sans JP", "Inter", sans-serif; }
  .option { transition: background-color .2s, border-color .2s; cursor: pointer; }
  .option:not(.answered):hover { background-color: #f0f4ff; border-color: #a3bffa; }
  .correct { background-color: #e6fffa; border-color: #38a169; color: #2f855a; font-weight: 600; }
  .incorrect { background-color: #fff5f5; border-color: #e53e3e; color: #c53030; }
  .answered { cursor: default; }
  
  .explanation, .hint, .memo-area, .ai-area { display:none; margin-top: 0.75rem; padding: 0.75rem; border-left-width: 4px; border-radius: 0.25rem; }
  .explanation { background-color: #f7fafc; border-color: #4a5568; color: #2d3748; }
  .hint { background-color: #fffaf0; border-color: #f6e05e; color: #975a16; }
  .memo-area { background-color: #ebf8ff; border-color: #4299e1; color: #2b6cb0; }
  .ai-area { background-color: #f3e8ff; border-color: #805ad5; color: #553c9a; }
  
  .feedback-icon { font-size: 1.25rem; font-weight: bold; }
  .correct .feedback-icon::after { content: '〇'; color: #38a169; }
  .incorrect .feedback-icon::after { content: '×'; color: #e53e3e; }
  
  #resultModal.hidden { display: none; }
  #deletedModal.hidden { display: none; }
  
  .csv-editor { 
      font-family: monospace; 
      white-space: pre-wrap; 
      word-break: break-all; 
      overflow-y: auto;
  }
</style>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="container mx-auto p-3 sm:p-6 lg:p-8 max-w-4xl">
    
    <!-- コントロールパネル -->
    <section class="bg-white p-3 rounded-lg shadow-md mb-6">
      <!-- 上段：主要操作 -->
      <div class="flex flex-wrap items-center justify-end gap-2 mb-2">
        <select id="csvSelect" class="border-gray-300 rounded-md shadow-sm text-sm p-2 flex-grow min-w-[150px]" title="問題セットを選択"></select>
        
        <!-- 文字サイズ -->
        <select id="fontSizeSelect" class="border-gray-300 rounded-md shadow-sm text-sm p-2" title="文字サイズ">
            <option value="text-sm">文字: 小</option>
            <option value="text-base" selected>文字: 中</option>
            <option value="text-lg">文字: 大</option>
        </select>

        <!-- 出題数変更 -->
        <select id="numSelect" class="border-gray-300 rounded-md shadow-sm text-sm p-2 w-20" title="出題数を選択">
          <option value="3">3問</option>
          <option value="5">5問</option>
          <option value="7">7問</option>
          <option value="10" selected>10問</option>
          <option value="15">15問</option>
          <option value="20">20問</option>
          <option value="28">28問</option>
        </select>
        
        <!-- このボタンは「現在の状態（エディタ含む）」で再出題するだけ -->
        <button id="loadBtn" class="bg-blue-600 text-white font-bold py-2 px-3 rounded-lg text-sm hover:bg-blue-700 transition-colors">開始 / 再読込</button>
      </div>

      <!-- CSVエディタ -->
      <div class="mt-2 border-t pt-2">
        <details> 
            <summary class="cursor-pointer text-xs font-bold text-gray-600 bg-gray-50 p-2 rounded hover:bg-gray-100 flex justify-between items-center">
                <span>📄 CSVデータ編集</span>
            </summary>
            <div class="mt-2">
                <textarea id="rawCsvArea" class="w-full h-48 border border-gray-300 rounded p-2 text-xs csv-editor bg-white focus:ring-2 focus:ring-blue-500" placeholder="ここにCSVデータが表示されます..."></textarea>
                <div class="flex gap-2 mt-2 justify-end items-center">
                    <span id="editModeIndicator" class="text-xs font-bold text-red-500 hidden mr-auto">※手動収集中（上の再読込ボタンはこの内容を使います）</span>
                    
                    <!-- オリジナル読込ボタンを追加 -->
                    <button id="resetRawBtn" class="bg-gray-200 text-gray-700 px-3 py-1 rounded text-xs font-bold hover:bg-gray-300 border border-gray-300">オリジナルを読込</button>
                    
                    <button id="copyRawBtn" class="bg-gray-500 text-white px-3 py-1 rounded text-xs font-bold hover:bg-gray-600">コピー</button>
                    <button id="runFromRawBtn" class="bg-teal-600 text-white px-3 py-1 rounded text-xs font-bold hover:bg-teal-700 shadow">この内容で実行</button>

        </details>

      <!-- ジャンル選択 -->

        <label class="flex items-center text-xs sm:text-sm font-medium text-gray-700 cursor-pointer">

          <span class="ml-1">法規等</span>
        </label>
        <label class="flex items-center text-xs sm:text-sm font-medium text-gray-700 cursor-pointer">
          <input type="checkbox" class="genre-cb h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" value="基準点測量" checked>
          <span class="ml-1">基準点測量</span>
        </label>
        <label class="flex items-center text-xs sm:text-sm font-medium text-gray-700 cursor-pointer">
          <input type="checkbox" class="genre-cb h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" value="地図・GIS" checked>
          <span class="ml-1">地図・GIS</span>
        </label>
        <label class="flex items-center text-xs sm:text-sm font-medium text-gray-700 cursor-pointer">
          <input type="checkbox" class="genre-cb h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" value="応用測量" checked>
          <span class="ml-1">応用測量</span>
        </label>
      </div>

      <!-- 下段：詳細設定 -->
      <div class="mt-2 pt-2 border-t">
        <details>
          <summary class="cursor-pointer text-xs font-medium text-gray-500 hover:text-gray-900">
            詳細設定・ログ管理
          </summary>
          <div class="mt-2 grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs text-gray-500">除外: 最低正解数</label>
              <input id="minCorrect" type="number" min="1" value="3" class="mt-1 w-full border-gray-300 rounded shadow-sm text-sm p-1" />
            </div>
            <div>
              <label class="block text-xs text-gray-500">除外: 最低正答率(%)</label>
              <input id="minRate" type="number" min="0" max="100" value="80" class="mt-1 w-full border-gray-300 rounded shadow-sm text-sm p-1" />
            </div>
          </div>
          <div class="mt-2 pt-2 border-t flex flex-wrap items-center gap-2">
            <div class="flex items-center gap-1">
                <input id="soundToggle" type="checkbox" class="h-4 w-4" checked />
                <label for="soundToggle" class="text-xs text-gray-600">音</label>
            </div>
            <div class="flex-grow"></div>
            <button id="showStats" class="bg-gray-200 text-gray-700 px-2 py-1 rounded text-xs hover:bg-gray-300">ログ</button>
            <button id="exportStats" class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs hover:bg-green-200">保存</button>
            <button id="importStats" class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs hover:bg-green-200">読込</button>
            <input type="file" id="importFile" class="hidden" accept=".json">
            <button id="clearStats" class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs hover:bg-red-200">リセット</button>
            <button id="manageDeletedBtn" class="bg-red-50 text-red-700 px-2 py-1 rounded text-xs hover:bg-red-100">削除管理</button>
            <button id="copyCsvBtn" class="bg-indigo-100 text-indigo-800 px-2 py-1 rounded text-xs hover:bg-indigo-200">抽出コピー</button>
          </div>
        </details>
      </div>
      <div id="notice" class="text-sm text-yellow-600 mt-2 text-center"></div>
    </section>

    <!-- 問題表示領域 -->
    <main id="quizArea" class="space-y-4"></main>

    <!-- 結果表示モーダル -->
    <div id="resultModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center z-50">
      <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md mx-4 text-center">
        <h2 class="text-xl font-bold mb-4">結果発表</h2>
        <p id="scoreText" class="text-4xl font-bold my-4 text-blue-600"></p>
        <p id="feedbackText" class="text-base text-gray-700 mb-6"></p>
        <div class="space-y-2">
            <button id="retryWrongBtn" class="w-full bg-orange-500 text-white font-bold py-2 px-4 rounded hover:bg-orange-600 hidden">間違えた問題のみリトライ</button>
            <button id="retryBtn" class="w-full bg-indigo-500 text-white font-bold py-2 px-4 rounded hover:bg-indigo-600">同じ問題でもう一度</button>
            <button id="newQuizBtn" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700">新しい問題で挑戦</button>
            <button id="closeModalBtn" class="w-full bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded hover:bg-gray-300">閉じる</button>
        </div>
      </div>
    </div>

    <!-- 削除済み管理モーダル -->
    <div id="deletedModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center z-50">
      <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-lg mx-4">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold">削除済みの問題</h3>
          <div class="flex items-center gap-2">
            <button id="restoreAllBtn" class="bg-green-100 text-green-800 px-3 py-1 rounded text-sm hover:bg-green-200">全復元</button>
            <button id="closeDeletedModal" class="bg-gray-100 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-200">閉じる</button>
          </div>
        </div>
        <div id="deletedList" class="space-y-2 text-sm text-gray-700 max-h-72 overflow-auto"></div>
      </div>
    </div>
  </div>

<script>
/* ---------------- config.js 読み込みチェック ---------------- */
if (typeof CONFIG === 'undefined') {
    alert("エラー: config.js が見つかりません。\nAPIキーを設定した config.js を index.html と同じ場所に置いてください。");
}

/* ---------------- 設定定数 ---------------- */
const csvFilesFallback = ["knowledge.csv", "basic.csv"]; 
const STORAGE_KEY = "rccmDrillStats_v4_ID";
const DELETED_KEY = "rccmDrillDeleted_v1";
const MEMO_KEY = "rccmDrillMemos_v1";
const SETTINGS_KEY = "rccmDrillSettings_v1"; // UI設定保存用

/* ---------------- DOM要素 ---------------- */
const csvSelect = document.getElementById("csvSelect");
const loadBtn = document.getElementById("loadBtn");
const rawCsvArea = document.getElementById("rawCsvArea");
const runFromRawBtn = document.getElementById("runFromRawBtn");
const resetRawBtn = document.getElementById("resetRawBtn");
const copyRawBtn = document.getElementById("copyRawBtn");
const editModeIndicator = document.getElementById("editModeIndicator");
const fontSizeSelect = document.getElementById("fontSizeSelect");
const retryBtn = document.getElementById("retryBtn");
const retryWrongBtn = document.getElementById("retryWrongBtn");
const quizArea = document.getElementById("quizArea");
const numSelect = document.getElementById("numSelect");
const minCorrectInput = document.getElementById("minCorrect");
const minRateInput = document.getElementById("minRate");
const soundToggle = document.getElementById("soundToggle");
const clearStatsBtn = document.getElementById("clearStats");
const showStatsBtn = document.getElementById("showStats");
const exportStatsBtn = document.getElementById("exportStats");
const importStatsBtn = document.getElementById("importStats");
const importFile = document.getElementById("importFile");
const notice = document.getElementById("notice");
const resultModal = document.getElementById("resultModal");
const scoreText = document.getElementById("scoreText");
const feedbackText = document.getElementById("feedbackText");
const newQuizBtn = document.getElementById("newQuizBtn");
const closeModalBtn = document.getElementById("closeModalBtn");
const manageDeletedBtn = document.getElementById("manageDeletedBtn");
const deletedModal = document.getElementById("deletedModal");
const deletedList = document.getElementById("deletedList");
const closeDeletedModal = document.getElementById("closeDeletedModal");
const restoreAllBtn = document.getElementById("restoreAllBtn");
const copyCsvBtn = document.getElementById("copyCsvBtn");

/* ---- 状態管理 ---- */
let currentSet = [];
let allQuestions = [];
let statsCache = loadStats();
let memosCache = loadMemos();
let answeredCount = 0;
let lastWrongIds = []; 
let isManualMode = false;

/* ---- 初期化処理 ---- */
(async function init() {
  // ファイル一覧取得
  let list = [];
  try {
    const r = await fetch("index.json");
    if (r.ok) list = await r.json();
  } catch(e) { /* ignore */ }
  if (!Array.isArray(list) || list.length === 0) list = csvFilesFallback;
  list.forEach(f => {
    const opt = document.createElement("option");
    opt.value = f; opt.textContent = f;
    csvSelect.appendChild(opt);
  });
  
  // UI設定の復元（チェックボックス、問数など）
  loadUISettings();

  // イベントリスナー登録（設定保存用）
  [csvSelect, fontSizeSelect, numSelect, minCorrectInput, minRateInput, soundToggle].forEach(el => {
      el.addEventListener('change', saveUISettings);
  });
  document.querySelectorAll('.genre-cb').forEach(el => {
      el.addEventListener('change', saveUISettings);
  });

  // フォントサイズ即時反映
  fontSizeSelect.addEventListener("change", () => renderAll(currentSet));

  // キーボードショートカット
  document.addEventListener('keydown', (e) => {
    if (resultModal.classList.contains('hidden')) {
      const key = e.key;
      if (['1', '2', '3', '4', '5'].includes(key)) {
        const index = parseInt(key) - 1;
        const unanswered = Array.from(quizArea.children).find(card => !card.querySelector('.options-container').classList.contains('answered'));
        if (unanswered) {
            const opts = unanswered.querySelectorAll('.option');
            if (opts[index]) opts[index].click();
        }
      }
    } else {
      if (e.key === 'Enter') closeModalBtn.click();
    }
  });

  // テキストエリアの変更監視（変更されたらマニュアルモードON）
  rawCsvArea.addEventListener('input', () => {
      isManualMode = true;
      editModeIndicator.classList.remove('hidden');
  });

})();

/* ---- UI設定の保存と復元 ---- */
function saveUISettings() {
    const settings = {
        csv: csvSelect.value,
        fontSize: fontSizeSelect.value,
        num: numSelect.value,
        minCorrect: minCorrectInput.value,
        minRate: minRateInput.value,
        sound: soundToggle.checked,
        genres: Array.from(document.querySelectorAll('.genre-cb')).map(cb => ({val: cb.value, checked: cb.checked}))
    };
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function loadUISettings() {
    try {
        const s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
        if (!s) return;
        if (s.csv) csvSelect.value = s.csv;
        if (s.fontSize) fontSizeSelect.value = s.fontSize;
        if (s.num) numSelect.value = s.num;
        if (s.minCorrect) minCorrectInput.value = s.minCorrect;
        if (s.minRate) minRateInput.value = s.minRate;
        if (s.sound !== undefined) soundToggle.checked = s.sound;
        if (s.genres) {
            s.genres.forEach(g => {
                const cb = document.querySelector(`.genre-cb[value="${g.val}"]`);
                if (cb) cb.checked = g.checked;
            });
        }
    } catch(e) { console.error("設定読み込みエラー", e); }
}

/* ---- WebAudio APIによる効果音 ---- */
let audioCtx = null;
function ensureAudioCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, startOffset, duration=0.16){
  ensureAudioCtx();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = "sine";
  o.frequency.value = freq;
  o.connect(g); g.connect(audioCtx.destination);
  const now = audioCtx.currentTime + startOffset;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.18, now+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, now+duration);
  o.start(now); o.stop(now+duration+0.02);
}
function playDoReMi(){
  if (!soundToggle.checked) return;
  playTone(523.25, 0); 
  playTone(587.33, 0.14); 
  playTone(659.25, 0.28); 
}

/* ---- テキスト整形 ---- */
function cleanText(str) {
    if (!str) return "";
    let s = str.toString().trim();
    s = s.replaceAll("◆", "<br>");
    s = s.replace(/\n/g, "<br>");
    return s;
}

/* ---- CSVデータ解析 ---- */
function buildQuestionsFromCSV(text){
  const parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
  return parsed.data.map((row) => {
    const id = row["ID"] || "";
    const genre = row["ジャンル"] || "未分類";
    
    const qText = cleanText(row["問題"]);
    const correctText = cleanText(row["正解"]);
    const opt2 = cleanText(row["選択肢2"]);
    const opt3 = cleanText(row["選択肢3"]);
    const opt4 = cleanText(row["選択肢4"]);
    const opt5 = cleanText(row["選択肢5"]);
    const explanation = cleanText(row["解説"]);
    const hint = cleanText(row["ヒント"]);
    
    if (!id || !qText || !correctText) return null;

    const rawOptions = [correctText, opt2, opt3, opt4, opt5].filter(Boolean);
    shuffleArray(rawOptions);

    const optionsMap = {};
    const labels = ["a", "b", "c", "d", "e"];
    rawOptions.forEach((opt, i) => {
      optionsMap[labels[i]] = opt; 
    });

    const correctLabel = Object.keys(optionsMap).find(key => optionsMap[key] === correctText);
    return { 
        id: id.trim(), 
        genre: genre.trim(),
        question: qText, 
        options: optionsMap, 
        answer: correctLabel, 
        correctText: correctText, 
        explanation: explanation, 
        hint: hint 
    };
  }).filter(Boolean);
}

/* ---- ストレージ管理 ---- */
function loadStats(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }catch(e){return{}} }
function saveStats(obj){ localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); }
function loadDeleted(){ try{ return JSON.parse(localStorage.getItem(DELETED_KEY) || "[]"); }catch(e){ return []; } }
function saveDeleted(arr){ localStorage.setItem(DELETED_KEY, JSON.stringify(arr)); }
function loadMemos(){ try{ return JSON.parse(localStorage.getItem(MEMO_KEY) || "{}"); }catch(e){return{}} }
function saveMemos(obj){ localStorage.setItem(MEMO_KEY, JSON.stringify(obj)); }
function shouldExclude(q, stats, minCorrect, minRate){
  const rec = stats[q.id] || { correct:0, total:0 };
  if (rec.total === 0) return false;
  const rate = (rec.correct / rec.total) * 100;
  return (rec.correct >= minCorrect) && (rate >= minRate);
}

/* ---- メイン：問題読み込みと描画 ---- */
async function loadAndRender(isRetry = false, onlyWrong = false, forceManual = false, forceFetch = false) {
  notice.textContent = "";
  quizArea.innerHTML = "";
  answeredCount = 0;
  resultModal.classList.add("hidden");
  statsCache = loadStats();
  memosCache = loadMemos();

  // モード制御
  if (forceFetch) {
      isManualMode = false;
      editModeIndicator.classList.add('hidden');
  } else if (forceManual) {
      isManualMode = true;
      editModeIndicator.classList.remove('hidden');
  }

  // リトライ処理
  if (isRetry) {
      if (onlyWrong) {
          const wrongSet = currentSet.filter(q => lastWrongIds.includes(q.id));
          currentSet = wrongSet;
      }
      if(currentSet.length === 0) {
          notice.textContent = "リトライする問題がありません。";
          return;
      }
      renderAll(currentSet);
      return;
  }

  // フィルタリング
  const selectedGenres = Array.from(document.querySelectorAll('.genre-cb:checked')).map(cb => cb.value);
  if (selectedGenres.length === 0) {
      notice.textContent = "ジャンルを1つ以上選択してください。";
      return;
  }

  const filename = csvSelect.value;
  const num = parseInt(numSelect.value,10) || 10;
  const minCorrect = parseInt(minCorrectInput.value,10) || 3;
  const minRate = parseFloat(minRateInput.value) || 80;
  const deletedIds = new Set(loadDeleted());

  try {
    let text = "";
    // マニュアルモード（テキストエリア優先）か、通常ロード（ファイル優先）か
    if (isManualMode && !forceFetch) {
        text = rawCsvArea.value;
        if (!text.trim()) throw new Error("CSVエディタが空です。");
    } else {
        // ファイルから読み込み（初回 or オリジナル読込ボタン）
        const r = await fetch(filename);
        if (!r.ok) throw new Error(`CSVファイル「${filename}」の取得に失敗しました。`);
        text = await r.text();
        rawCsvArea.value = text;
        
        // 通常ロード時はモードOFF
        if(forceFetch) {
            isManualMode = false;
            editModeIndicator.classList.add('hidden');
        }
    }

    allQuestions = buildQuestionsFromCSV(text);
    const genreFiltered = allQuestions.filter(q => selectedGenres.includes(q.genre));
    const filteredAll = genreFiltered.filter(q => !deletedIds.has(q.id));
    
    let candidates = filteredAll.filter(q => !shouldExclude(q, statsCache, minCorrect, minRate));
    // 問題不足時の補充ロジック
    if (candidates.length < num && filteredAll.length >= num) {
      notice.textContent = `苦手問題が${candidates.length}問しかありませんでした。学習済みの問題から補充して出題します。`;
      const excluded = filteredAll.filter(q => shouldExclude(q, statsCache, minCorrect, minRate));
      shuffleArray(excluded);
      candidates.push(...excluded.slice(0, num - candidates.length));
    }
    
    shuffleArray(candidates);
    currentSet = candidates.slice(0, Math.min(num, filteredAll.length));
    
    if (currentSet.length === 0) {
        notice.textContent = "出題できる問題がありません。";
        return;
    }
    renderAll(currentSet);
  } catch(err) {
    quizArea.innerHTML = `<div class="bg-red-100 p-4 rounded text-red-700">${err.message}</div>`;
    console.error(err);
  }
}

/* ---- 描画 ---- */
function renderAll(set){
  quizArea.innerHTML = "";
  const fontClass = fontSizeSelect.value || "text-base";

  set.forEach((q, idx) => {
    const card = document.createElement("div");
    card.className = `bg-white p-4 sm:p-6 rounded-lg shadow-md question-card ${fontClass}`;
    card.dataset.id = q.id;

    const metaHeader = document.createElement("div");
    metaHeader.className = "flex flex-wrap items-center gap-2 mb-2 pb-2 border-b border-gray-100";
    const titleGroup = document.createElement("div");
    titleGroup.className = "flex items-baseline gap-2";
    titleGroup.innerHTML = `<span class="font-bold text-blue-600 whitespace-nowrap">問${idx + 1}</span><span class="text-xs text-gray-400 font-mono">[${q.id}]</span>`;
    const controlGroup = document.createElement("div");
    controlGroup.className = "flex items-center gap-2 ml-auto";
    const statsBadge = document.createElement("div");
    statsBadge.className = "stats-badge text-xs font-bold px-2 py-0.5 rounded-full text-white whitespace-nowrap";
    updateStatsBadge(statsBadge, q.id);
    const deleteBtn = document.createElement("button");
    deleteBtn.className = "text-red-400 hover:text-red-600 px-1 rounded";
    deleteBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>`;
    deleteBtn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      if (!confirm("この問題を削除（今後出題しない）しますか？")) return;
      const deleted = loadDeleted();
      if (!deleted.includes(q.id)) { deleted.push(q.id); saveDeleted(deleted); }
      currentSet = currentSet.filter(c => c.id !== q.id);
      card.remove();
      if (answeredCount === currentSet.length) showResult();
    });
    controlGroup.appendChild(statsBadge);
    controlGroup.appendChild(deleteBtn);
    metaHeader.appendChild(titleGroup);
    metaHeader.appendChild(controlGroup);
    card.appendChild(metaHeader);

    const qBody = document.createElement("div");
    qBody.className = "mb-4 font-medium leading-relaxed";
    qBody.innerHTML = q.question; 
    card.appendChild(qBody);

    const btnGroup = document.createElement("div");
    btnGroup.className = "flex flex-wrap gap-2 mb-4";
    if (q.hint) {
        const hintBtn = document.createElement("button");
        hintBtn.className = "bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-xs font-semibold hover:bg-yellow-200";
        hintBtn.textContent = "💡 ヒント";
        const hintEl = document.createElement("div");
        hintEl.className = "hint text-sm";
        hintEl.innerHTML = `<strong class="font-semibold">【ヒント】</strong> ${q.hint}`;
        hintBtn.addEventListener("click", () => { hintEl.style.display = hintEl.style.display === "block" ? "none" : "block"; });
        btnGroup.appendChild(hintBtn);
        card.appendChild(hintEl);
    }
    const memoBtn = document.createElement("button");
    const hasMemo = memosCache[q.id] && memosCache[q.id].trim().length > 0;
    memoBtn.className = `px-3 py-1 rounded-full text-xs font-semibold transition-colors ${hasMemo ? 'bg-blue-500 text-white hover:bg-blue-600' : 'bg-blue-100 text-blue-800 hover:bg-blue-200'}`;
    memoBtn.innerHTML = hasMemo ? "📝 メモあり" : "📝 自分用メモ";
    const memoEl = document.createElement("div");
    memoEl.className = "memo-area";
    const memoTextarea = document.createElement("textarea");
    memoTextarea.className = "w-full p-2 border rounded text-sm bg-white h-24";
    memoTextarea.placeholder = "メモ（自動保存）";
    memoTextarea.value = memosCache[q.id] || "";
    memoTextarea.addEventListener("input", (e) => {
        const val = e.target.value;
        memosCache[q.id] = val;
        saveMemos(memosCache);
        if (val.trim().length > 0) {
            memoBtn.className = 'bg-blue-500 text-white hover:bg-blue-600 px-3 py-1 rounded-full text-xs font-semibold';
            memoBtn.innerHTML = "📝 メモあり";
        } else {
            memoBtn.className = 'bg-blue-100 text-blue-800 hover:bg-blue-200 px-3 py-1 rounded-full text-xs font-semibold';
            memoBtn.innerHTML = "📝 自分用メモ";
        }
    });
    memoBtn.addEventListener("click", () => {
        const isShown = memoEl.style.display === "block";
        memoEl.style.display = isShown ? "none" : "block";
        if (!isShown) memoTextarea.focus();
    });
    const aiBtn = document.createElement("button");
    aiBtn.className = "bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-xs font-semibold hover:bg-purple-200 transition-colors";
    aiBtn.innerHTML = "🤖 AIに聞く";
    const aiEl = document.createElement("div");
    aiEl.className = "ai-area";
    aiEl.innerHTML = `<div class="text-xs font-bold mb-1 text-purple-700">AIへの質問</div><textarea class="w-full p-2 border border-purple-200 rounded text-sm mb-2 h-16" placeholder="例：なぜ正解はaなの？"></textarea><button class="bg-purple-600 text-white font-bold py-1 px-3 rounded text-xs hover:bg-purple-700 w-full mb-2">送信</button><div class="ai-response text-sm text-gray-800 whitespace-pre-wrap bg-white p-2 rounded border border-purple-200 hidden"></div>`;
    const aiTextarea = aiEl.querySelector("textarea");
    const aiSubmitBtn = aiEl.querySelector("button");
    const aiResponseDiv = aiEl.querySelector(".ai-response");
    aiSubmitBtn.addEventListener("click", async () => {
        const userQ = aiTextarea.value.trim();
        if(!userQ) { alert("質問内容を入力してください"); return; }
        if(typeof CONFIG === 'undefined' || !CONFIG.API_KEY || CONFIG.API_KEY.includes("YOUR")) { alert("config.js にAPIキーを設定してください"); return; }
        aiSubmitBtn.disabled = true; aiSubmitBtn.textContent = "考え中...";
        aiResponseDiv.textContent = "通信中..."; aiResponseDiv.classList.remove("hidden");
        try {
            const advice = await getAIAdvice(q, userQ);
            aiResponseDiv.innerHTML = `<strong>【AI回答】</strong><br>${advice.replace(/\n/g, '<br>')}`;
        } catch(e) { aiResponseDiv.textContent = "エラー: " + e.message; }
        finally { aiSubmitBtn.disabled = false; aiSubmitBtn.textContent = "送信"; }
    });
    aiBtn.addEventListener("click", () => { aiEl.style.display = aiEl.style.display === "block" ? "none" : "block"; });
    btnGroup.appendChild(memoBtn); btnGroup.appendChild(aiBtn);
    card.appendChild(btnGroup); card.appendChild(memoEl); card.appendChild(aiEl);

    const optsContainer = document.createElement("div");
    optsContainer.className = "options-container space-y-2";
    Object.keys(q.options).forEach(lbl => {
      const txt = q.options[lbl];
      const opt = document.createElement("div");
      opt.className = "option border border-gray-300 p-3 rounded-lg flex justify-between items-center";
      opt.dataset.label = lbl;
      opt.innerHTML = `<span><span class="font-bold mr-2 text-blue-600">${lbl.toUpperCase()}.</span>${txt}</span><span class="feedback-icon"></span>`;
      opt.addEventListener("click", () => onOptionClick(opt, q, card));
      optsContainer.appendChild(opt);
    });
    card.appendChild(optsContainer);

    const exp = document.createElement("div");
    exp.className = "explanation text-sm";
    exp.innerHTML = `<p><strong class="font-semibold">【解説】</strong> ${q.explanation || "（解説なし）"}</p>`;
    card.appendChild(exp);
    quizArea.appendChild(card);
  });
}

function updateStatsBadge(badge, qid) {
    const st = statsCache[qid] || { correct: 0, total: 0 };
    const rate = st.total > 0 ? (st.correct / st.total) * 100 : -1;
    badge.textContent = `${st.correct}/${st.total}`;
    badge.classList.remove("bg-gray-400", "bg-red-500", "bg-yellow-500", "bg-green-500");
    if (rate === -1) badge.classList.add("bg-gray-400"); 
    else if (rate < 50) badge.classList.add("bg-red-500");
    else if (rate < 80) badge.classList.add("bg-yellow-500");
    else badge.classList.add("bg-green-500");
}
function onOptionClick(optEl, q, cardEl){
  const optsContainer = cardEl.querySelector(".options-container");
  if (optsContainer.classList.contains("answered")) return;
  optsContainer.classList.add("answered");
  answeredCount++;
  const selectedLbl = optEl.dataset.label;
  const correctLbl = q.answer;
  cardEl.querySelectorAll(".option").forEach(o => {
    o.classList.add("answered");
    if (o.dataset.label === correctLbl) o.classList.add("correct");
  });
  let isCorrect = false;
  if (selectedLbl !== correctLbl) optEl.classList.add("incorrect");
  else { isCorrect = true; playDoReMi(); }
  const exp = cardEl.querySelector(".explanation");
  if (exp) exp.style.display = "block";
  const stats = loadStats();
  if (!stats[q.id]) stats[q.id] = { correct:0, total:0 };
  stats[q.id].total++;
  if (isCorrect) stats[q.id].correct++;
  saveStats(stats);
  statsCache = stats;
  updateStatsBadge(cardEl.querySelector(".stats-badge"), q.id);
  if (answeredCount === currentSet.length) showResult();
}
function showResult() {
    let correctCount = 0; lastWrongIds = [];
    document.querySelectorAll('.question-card').forEach(card => {
        const opts = card.querySelector('.options-container');
        if (opts && !opts.querySelector('.option.incorrect')) correctCount++;
        else lastWrongIds.push(card.dataset.id);
    });
    scoreText.textContent = `${correctCount} / ${currentSet.length} 正解`;
    feedbackText.textContent = correctCount === currentSet.length ? '全問正解！' : 'お疲れ様でした。';
    if (lastWrongIds.length > 0) {
        retryWrongBtn.classList.remove('hidden');
        retryWrongBtn.onclick = () => loadAndRender(true, true);
    } else retryWrongBtn.classList.add('hidden');
    resultModal.classList.remove('hidden');
}
async function getAIAdvice(q, userInput) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.AI_MODEL}:generateContent?key=${CONFIG.API_KEY}`;
    const prompt = `あなたは測量士試験のプロ講師です。\n【問題】${q.question}\n【正解】${q.correctText}\n【解説】${q.explanation}\n【質問】${userInput}\n簡潔に回答してください。`;
    const response = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
    if (!response.ok) throw new Error("APIエラー");
    const data = await response.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text || "エラー";
}
function shuffleArray(a){ for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

/* ---- ボタンイベント (ロジック修正済み) ---- */
// 再読込ボタン：手動モードならそのまま、そうでなければサーバーから（でも既存のisManualModeフラグに従う）
loadBtn.addEventListener("click", () => {
    // ここで isManualMode を強制的に false にしてはいけない
    // そのまま loadAndRender を呼ぶことで、isManualMode が true ならテキストエリアの内容が使われる
    loadAndRender(false, false); 
});

// この内容で実行：強制的にマニュアルモードON
runFromRawBtn.addEventListener("click", () => loadAndRender(false, false, true));

// オリジナルを読込：強制的にマニュアルモードOFFでサーバーから取得
resetRawBtn.addEventListener("click", () => {
    if(confirm("手動編集した内容を破棄して、サーバーのファイルを読み込み直しますか？")) {
        loadAndRender(false, false, false, true); // forceFetch = true
    }
});

copyRawBtn.addEventListener("click", () => { navigator.clipboard.writeText(rawCsvArea.value).then(()=>alert("コピーしました")); });
retryBtn.addEventListener("click", () => loadAndRender(true));
newQuizBtn.addEventListener("click", () => loadAndRender(false));
closeModalBtn.addEventListener("click", () => resultModal.classList.add("hidden"));
clearStatsBtn.addEventListener("click", () => { if (confirm("ログを消去しますか？")) { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(MEMO_KEY); location.reload(); } });
showStatsBtn.addEventListener("click", () => { alert(`ログ: ${Object.keys(loadStats()).length}問`); });
manageDeletedBtn.addEventListener("click", () => {
    deletedList.innerHTML = "";
    loadDeleted().forEach(id => {
        const div = document.createElement("div"); div.className = "flex justify-between border p-2";
        div.innerHTML = `<span>${id}</span><button class="text-blue-500 text-xs" onclick="restore('${id}')">復元</button>`;
        deletedList.appendChild(div);
    });
    deletedModal.classList.remove("hidden");
});
window.restore = (id) => { saveDeleted(loadDeleted().filter(x => x !== id)); manageDeletedBtn.click(); };
closeDeletedModal.addEventListener("click", () => deletedModal.classList.add("hidden"));
restoreAllBtn.addEventListener("click", () => { if(confirm("全復元しますか？")) { saveDeleted([]); manageDeletedBtn.click(); }});
importStatsBtn.addEventListener("click", () => importFile.click());
copyCsvBtn.addEventListener("click", async () => {
    const deleted = new Set(loadDeleted());
    const filtered = allQuestions.filter(q => !deleted.has(q.id));
    if (filtered.length === 0) { alert("データなし"); return; }
    const headers = ["ID","ジャンル","問題","正解","選択肢2","選択肢3","選択肢4","選択肢5","解説","ヒント"];
    let csvContent = headers.join(",") + "\n";
    filtered.forEach(q => {
        const others = Object.values(q.options).filter(v => v !== q.correctText);
        const escape = (s) => {
            if(!s) return "";
            let str = s.toString().replaceAll("<br>", "邺");
            if(str.includes(",") || str.includes("\"") || str.includes("\n")) return `"${str.replace(/"/g, '""')}"`;
            return str;
        };
        csvContent += [q.id, q.genre, q.question, q.correctText, others[0]||"", others[1]||"", others[2]||"", others[3]||"", q.explanation, q.hint].map(escape).join(",") + "\n";
    });
    await navigator.clipboard.writeText(csvContent);
    alert("コピーしました");
});
exportStatsBtn.addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ stats: loadStats(), deleted: loadDeleted(), memos: loadMemos() }, null, 2)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "data.json"; a.click();
});
importFile.addEventListener("change", (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        const d = JSON.parse(ev.target.result);
        if(d.stats) saveStats(d.stats); if(d.deleted) saveDeleted(d.deleted); if(d.memos) saveMemos(d.memos);
        alert("読み込み完了"); location.reload();
    };
    reader.readAsText(file);
});
</script>
