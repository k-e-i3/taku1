<script>

/* ---------------- 設定 ---------------- */

/* ---------------- DOM要素 ---------------- */

/* ---- 初期化処理 ---- */
(async function init() {

/* ---- WebAudio APIによる効果音 ---- */
let audioCtx = null;
function ensureAudioCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, startOffset, duration=0.16){
  ensureAudioCtx();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = "sine";
  o.frequency.value = freq;
  o.connect(g); g.connect(audioCtx.destination);
  const now = audioCtx.currentTime + startOffset;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.18, now+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, now+duration);
  o.start(now); o.stop(now+duration+0.02);
}
function playDoReMi(){
  if (!soundToggle.checked) return;
  playTone(523.25, 0); 
  playTone(587.33, 0.14); 
  playTone(659.25, 0.28); 
}

/* ---- CSVデータから問題オブジェクトを生成 ---- */
function buildQuestionsFromCSV(text){
  const parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
  
  // 「邺」を改行タグに変換するヘルパー関数
  const clean = (str) => {
    if (!str) return "";
    return str.trim().replaceAll("邺", "<br>");
  };

  return parsed.data.map((row) => {
    const id = row["ID"] || "";
    const genre = row["ジャンル"] || "未分類";
    const qText = clean(row["問題"]);
    const correctText = clean(row["正解"]);
    const opt2 = clean(row["選択肢2"]);
    const opt3 = clean(row["選択肢3"]);
    const opt4 = clean(row["選択肢4"]);
    const opt5 = clean(row["選択肢5"]);
    const explanation = clean(row["解説"]);
    const hint = clean(row["ヒント"]);
    
    if (!id || !qText || !correctText) return null;

    const rawOptions = [correctText, opt2, opt3, opt4, opt5].filter(Boolean);
    shuffleArray(rawOptions);

    const optionsMap = {};
    const labels = ["a", "b", "c", "d", "e"];
    rawOptions.forEach((opt, i) => {
      optionsMap[labels[i]] = opt; // 変換済み
    });

    const correctLabel = Object.keys(optionsMap).find(key => optionsMap[key] === correctText);
    return { 
        id: id.trim(), 
        genre: genre.trim(),
        question: qText, 
        options: optionsMap, 
        answer: correctLabel, 
        correctText: correctText, // API送信用に保持
        explanation: explanation, 
        hint: hint 
    };
  }).filter(Boolean);
}

/* ---- 学習ログ・メモの操作 ---- */
function loadStats(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }catch(e){return{}} }
function saveStats(obj){ localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); }
function loadDeleted(){ try{ return JSON.parse(localStorage.getItem(DELETED_KEY) || "[]"); }catch(e){ return []; } }
function saveDeleted(arr){ localStorage.setItem(DELETED_KEY, JSON.stringify(arr)); }
function loadMemos(){ try{ return JSON.parse(localStorage.getItem(MEMO_KEY) || "{}"); }catch(e){return{}} }
function saveMemos(obj){ localStorage.setItem(MEMO_KEY, JSON.stringify(obj)); }

/* ---- 出題除外条件の判定 ---- */
function shouldExclude(q, stats, minCorrect, minRate){
  const rec = stats[q.id] || { correct:0, total:0 };
  if (rec.total === 0) return false;
  const rate = (rec.correct / rec.total) * 100;
  return (rec.correct >= minCorrect) && (rate >= minRate);
}

/* ---- 問題の読み込みと表示 ---- */
let currentSet = [], allQuestions = [], statsCache = loadStats(), memosCache = loadMemos(), answeredCount = 0;
let lastWrongIds = []; 

// useTextarea: trueなら画面上のCSVエディタの内容を使う
async function loadAndRender(isRetry = false, onlyWrong = false, useTextarea = false) {
  notice.textContent = "";
  quizArea.innerHTML = "";
  answeredCount = 0;
  resultModal.classList.add("hidden");
  statsCache = loadStats();
  memosCache = loadMemos();

  if (isRetry) {
      if (onlyWrong) {
          const wrongSet = currentSet.filter(q => lastWrongIds.includes(q.id));
          currentSet = wrongSet;
      }
      if(currentSet.length === 0) {
          notice.textContent = "リトライする問題がありません。";
          return;
      }
      renderAll(currentSet);
      return;
  }

  // 新規ロード
  const selectedGenres = Array.from(document.querySelectorAll('.genre-cb:checked')).map(cb => cb.value);
  if (selectedGenres.length === 0) {
      notice.textContent = "ジャンルを1つ以上選択してください。";
      return;
  }

  const filename = csvSelect.value;
  const num = parseInt(numSelect.value,10) || 10;
  const minCorrect = parseInt(minCorrectInput.value,10) || 3;
  const minRate = parseFloat(minRateInput.value) || 80;
  const deletedIds = new Set(loadDeleted());

  try {
    let text = "";
    if (useTextarea) {
        text = rawCsvArea.value;
        if (!text.trim()) throw new Error("CSVエディタが空です。");
    } else {
        const r = await fetch(filename);
        if (!r.ok) throw new Error(`CSVファイル「${filename}」の取得に失敗しました。`);
        text = await r.text();
        rawCsvArea.value = text;
    }

    allQuestions = buildQuestionsFromCSV(text);

    const genreFiltered = allQuestions.filter(q => selectedGenres.includes(q.genre));
    const filteredAll = genreFiltered.filter(q => !deletedIds.has(q.id));

    let candidates = filteredAll.filter(q => !shouldExclude(q, statsCache, minCorrect, minRate));
    if (candidates.length < num && filteredAll.length >= num) {
      notice.textContent = `苦手問題が${candidates.length}問しかありませんでした。学習済みの問題から補充して出題します。`;
      const excluded = filteredAll.filter(q => shouldExclude(q, statsCache, minCorrect, minRate));
      shuffleArray(excluded);
      candidates.push(...excluded.slice(0, num - candidates.length));
    }
    shuffleArray(candidates);
    currentSet = candidates.slice(0, Math.min(num, filteredAll.length));
    
    if (currentSet.length === 0) {
        notice.textContent = "出題できる問題がありません。";
        return;
    }
    renderAll(currentSet);
  } catch(err) {
    quizArea.innerHTML = `<div class="bg-red-100 p-4 rounded text-red-700">${err.message}</div>`;
    console.error(err);
  }
}

/* ---- 全問題カードの描画 ---- */
function renderAll(set){
  quizArea.innerHTML = "";
  set.forEach((q, idx) => {
    const card = document.createElement("div");
    card.className = "bg-white p-6 rounded-lg shadow-md question-card";
    card.dataset.id = q.id;

    // ヘッダー
    const header = document.createElement("div");
    header.className = "flex justify-between items-start mb-4";
    
    const titleContainer = document.createElement("div");
    titleContainer.className = "flex-1 mr-4";
    
    const questionTitle = document.createElement("p");
    questionTitle.className = "font-bold text-lg";
    questionTitle.innerHTML = `<span class="text-blue-600 font-semibold">問${idx + 1}.</span> ${q.question}`;
    const questionId = document.createElement("p");
    questionId.className = "text-xs text-gray-400 mt-1";
    questionId.textContent = `ID: ${q.id} [${q.genre}]`;
    
    titleContainer.appendChild(questionTitle);
    titleContainer.appendChild(questionId);
    
    const rightGroup = document.createElement("div");
    rightGroup.className = "flex items-center gap-2";

    const statsBadge = document.createElement("div");
    statsBadge.className = "stats-badge text-xs font-bold px-2.5 py-1 rounded-full text-white whitespace-nowrap";
    updateStatsBadge(statsBadge, q.id);

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "bg-red-50 text-red-700 px-2 py-1 rounded text-xs font-medium hover:bg-red-100";
    deleteBtn.textContent = "削除";
    deleteBtn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      if (!confirm("この問題を削除（今後出題しない）しますか？")) return;
      const deleted = loadDeleted();
      if (!deleted.includes(q.id)) { deleted.push(q.id); saveDeleted(deleted); }
      currentSet = currentSet.filter(c => c.id !== q.id);
      card.remove();
      if (answeredCount === currentSet.length) showResult();
    });

    rightGroup.appendChild(statsBadge);
    rightGroup.appendChild(deleteBtn);
    header.appendChild(titleContainer);
    header.appendChild(rightGroup);
    card.appendChild(header);

    // ボタンエリア
    const btnGroup = document.createElement("div");
    btnGroup.className = "flex flex-wrap gap-2 mb-4";

    // ヒントボタン
    if (q.hint) {
        const hintBtn = document.createElement("button");
        hintBtn.className = "bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-xs font-semibold hover:bg-yellow-200";
        hintBtn.textContent = "💡 ヒント";
        const hintEl = document.createElement("div");
        hintEl.className = "hint";
        hintEl.innerHTML = `<strong class="font-semibold">【ヒント】</strong> ${q.hint}`;
        
        hintBtn.addEventListener("click", () => {
          const isShown = hintEl.style.display === "block";
          hintEl.style.display = isShown ? "none" : "block";
        });
        btnGroup.appendChild(hintBtn);
        card.appendChild(hintEl);
    }

    // メモボタン
    const memoBtn = document.createElement("button");
    const hasMemo = memosCache[q.id] && memosCache[q.id].trim().length > 0;
    memoBtn.className = `px-3 py-1 rounded-full text-xs font-semibold transition-colors ${
        hasMemo ? 'bg-blue-500 text-white hover:bg-blue-600' : 'bg-blue-100 text-blue-800 hover:bg-blue-200'
    }`;
    memoBtn.innerHTML = hasMemo ? "📝 メモあり" : "📝 自分用メモ";
    
    const memoEl = document.createElement("div");
    memoEl.className = "memo-area";
    const memoTextarea = document.createElement("textarea");
    memoTextarea.className = "w-full p-2 border rounded text-sm bg-white h-24";
    memoTextarea.placeholder = "ここに自分用のメモを残せます（自動保存）";
    memoTextarea.value = memosCache[q.id] || "";
    
    memoTextarea.addEventListener("input", (e) => {
        const val = e.target.value;
        memosCache[q.id] = val;
        saveMemos(memosCache);
        if (val.trim().length > 0) {
            memoBtn.className = 'bg-blue-500 text-white hover:bg-blue-600 px-3 py-1 rounded-full text-xs font-semibold transition-colors';
            memoBtn.innerHTML = "📝 メモあり";
        } else {
            memoBtn.className = 'bg-blue-100 text-blue-800 hover:bg-blue-200 px-3 py-1 rounded-full text-xs font-semibold transition-colors';
            memoBtn.innerHTML = "📝 自分用メモ";
        }
    });

    memoBtn.addEventListener("click", () => {
        const isShown = memoEl.style.display === "block";
        memoEl.style.display = isShown ? "none" : "block";
        if (!isShown) memoTextarea.focus();
    });

    // ★ AIボタン (実際のAPI呼び出し)
    const aiBtn = document.createElement("button");
    aiBtn.className = "bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-xs font-semibold hover:bg-purple-200 transition-colors";
    aiBtn.innerHTML = "🤖 AIに聞く";

    const aiEl = document.createElement("div");
    aiEl.className = "ai-area";
    // AI用の入力エリアと結果表示エリア
    aiEl.innerHTML = `
        <div class="text-sm font-bold mb-2">🤖 AIチューターへの質問</div>
        <textarea class="w-full p-2 border border-purple-200 rounded text-sm mb-2 h-20" placeholder="質問を入力してください（例：なぜ選択肢2が間違っているの？）"></textarea>
        <button class="bg-purple-600 text-white font-bold py-1 px-4 rounded text-xs hover:bg-purple-700 w-full mb-2">質問を送信</button>
        <div class="ai-response text-sm text-gray-800 whitespace-pre-wrap bg-white p-3 rounded border border-purple-200 hidden"></div>
    `;

    // AIイベント
    const aiTextarea = aiEl.querySelector("textarea");
    const aiSubmitBtn = aiEl.querySelector("button");
    const aiResponseDiv = aiEl.querySelector(".ai-response");

    aiSubmitBtn.addEventListener("click", async () => {
        const userQ = aiTextarea.value.trim();
        if(!userQ) { alert("質問内容を入力してください"); return; }
        if(!GEMINI_API_KEY || GEMINI_API_KEY.includes("YOUR")) { alert("APIキーが設定されていません"); return; }
        
        aiSubmitBtn.disabled = true;
        aiSubmitBtn.textContent = "AI思考中...";
        aiResponseDiv.textContent = "通信中...";
        aiResponseDiv.classList.remove("hidden");
        
        try {
            const advice = await getAIAdvice(q, userQ);
            aiResponseDiv.innerHTML = `<strong>【AIの回答】</strong><br>${advice.replace(/\n/g, '<br>')}`;
        } catch(e) {
            aiResponseDiv.textContent = "エラー: " + e.message;
        } finally {
            aiSubmitBtn.disabled = false;
            aiSubmitBtn.textContent = "質問を送信";
        }
    });

    aiBtn.addEventListener("click", () => {
        const isShown = aiEl.style.display === "block";
        aiEl.style.display = isShown ? "none" : "block";
    });

    btnGroup.appendChild(memoBtn);
    btnGroup.appendChild(aiBtn); 
    card.appendChild(btnGroup);
    card.appendChild(memoEl);
    card.appendChild(aiEl); 

    // 選択肢
    const optsContainer = document.createElement("div");
    optsContainer.className = "options-container space-y-3";
    Object.keys(q.options).forEach(lbl => {
      const txt = q.options[lbl];
      const opt = document.createElement("div");
      opt.className = "option border border-gray-300 p-3 rounded-lg flex justify-between items-center";
      opt.dataset.label = lbl;
      opt.innerHTML = `<span><span class="font-bold mr-3">${lbl.toUpperCase()}.</span>${txt}</span><span class="feedback-icon"></span>`;
      opt.addEventListener("click", () => onOptionClick(opt, q, card));
      optsContainer.appendChild(opt);
    });
    card.appendChild(optsContainer);

    // 解説
    const exp = document.createElement("div");
    exp.className = "explanation";
    exp.innerHTML = `<p><strong class="font-semibold">【解説】</strong> ${q.explanation || "（解説なし）"}</p>`;
    card.appendChild(exp);

    quizArea.appendChild(card);
  });
}

/* ---- ステータスバッジの更新 ---- */
function updateStatsBadge(badge, qid) {
    const st = statsCache[qid] || { correct: 0, total: 0 };
    const rate = st.total > 0 ? (st.correct / st.total) * 100 : -1;

    badge.textContent = `${st.correct}/${st.total}`;
    badge.classList.remove("bg-gray-400", "bg-red-500", "bg-yellow-500", "bg-green-500");

    if (rate === -1) badge.classList.add("bg-gray-400"); 
    else if (rate < 50) badge.classList.add("bg-red-500");
    else if (rate < 80) badge.classList.add("bg-yellow-500");
    else badge.classList.add("bg-green-500");
}

/* ---- 選択肢クリック時の処理 ---- */
function onOptionClick(optEl, q, cardEl){
  const optsContainer = cardEl.querySelector(".options-container");
  if (optsContainer.classList.contains("answered")) return;
  optsContainer.classList.add("answered");

  answeredCount++;
  const selectedLbl = optEl.dataset.label;
  const correctLbl = q.answer;
  
  cardEl.querySelectorAll(".option").forEach(o => {
    o.classList.add("answered");
    if (o.dataset.label === correctLbl) o.classList.add("correct");
  });

  let isCorrect = false;
  if (selectedLbl !== correctLbl) {
    optEl.classList.add("incorrect");
  } else {
    isCorrect = true;
    playDoReMi();
  }
  
  const exp = cardEl.querySelector(".explanation");
  if (exp) exp.style.display = "block";

  const stats = loadStats();
  if (!stats[q.id]) stats[q.id] = { correct:0, total:0 };
  stats[q.id].total++;
  if (isCorrect) stats[q.id].correct++;
  saveStats(stats);
  statsCache = stats;

  const statsBadge = cardEl.querySelector(".stats-badge");
  updateStatsBadge(statsBadge, q.id);

  if (answeredCount === currentSet.length) {
    showResult();
  }
}

/* ---- 結果表示処理 ---- */
function showResult() {
    let correctCount = 0;
    lastWrongIds = [];
    
    const cards = document.querySelectorAll('.question-card');
    cards.forEach(card => {
        const opts = card.querySelector('.options-container');
        if (opts && !opts.querySelector('.option.incorrect')) {
            correctCount++;
        } else {
            lastWrongIds.push(card.dataset.id);
        }
    });

    const total = currentSet.length;
    scoreText.textContent = `${correctCount} / ${total} 正解`;
    
    let feedback = '';
    const rate = total > 0 ? (correctCount / total) * 100 : 0;
    if (rate === 100) feedback = '素晴らしい！全問正解です。';
    else if (rate >= 80) feedback = '優秀です！この調子で知識を定着させましょう。';
    else feedback = '間違えた問題の解説と、自分用メモを活用して復習しましょう！';
    feedbackText.textContent = feedback;

    if (lastWrongIds.length > 0) {
        retryWrongBtn.classList.remove('hidden');
        retryWrongBtn.textContent = `間違えた${lastWrongIds.length}問のみリトライ`;
        retryWrongBtn.onclick = () => {
             loadAndRender(true, true);
        };
    } else {
        retryWrongBtn.classList.add('hidden');
    }

    resultModal.classList.remove('hidden');
}

/* ---- AI API関数 ---- */
async function getAIAdvice(q, userInput) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
    
    const prompt = `あなたは測量士試験のプロ講師です。
以下の問題について、生徒の質問に答えてください。

【問題】${q.question}
【正解】${q.correctText}
【解説】${q.explanation}

【生徒の質問】
${userInput}

【指示】
・簡潔に、分かりやすく答えてください。
・励ましの言葉を含めてください。`;

    const response = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });

    if (!response.ok) {
        throw new Error("APIエラー: " + response.statusText);
    }
    const data = await response.json();
    try {
        return data.candidates[0].content.parts[0].text;
    } catch(e) {
        return "応答の解析に失敗しました。";
    }
}

/* ---- CSVをコピー ---- */
async function copyCsvExcludingDeleted() {
    const deleted = new Set(loadDeleted());
    const filtered = allQuestions.filter(q => !deleted.has(q.id));
    
    if (filtered.length === 0) {
        alert("有効な問題データがありません。");
        return;
    }
    // メモリ上のデータからCSV構築（簡易版）
    const headers = ["ID","ジャンル","問題","正解","選択肢2","選択肢3","選択肢4","選択肢5","解説","ヒント"];
    let csvContent = headers.join(",") + "\n";

    filtered.forEach(q => {
        // q.optionsはシャッフル済みなので、originalの正解を探す
        // 簡易実装として、正解とそれ以外に分ける
        const correctTxt = q.correctText;
        const others = Object.values(q.options).filter(v => v !== correctTxt);
        
        // エスケープ処理
        const escape = (s) => {
            if(!s) return "";
            let str = s.toString().replaceAll("<br>", "邺"); // 改行を邺に戻す
            if(str.includes(",") || str.includes("\"") || str.includes("\n")) {
                return `"${str.replace(/"/g, '""')}"`;
            }
            return str;
        };
        
        const row = [
            q.id, q.genre, q.question, correctTxt,
            others[0]||"", others[1]||"", others[2]||"", others[3]||"",
            q.explanation, q.hint
        ].map(escape);
        
        csvContent += row.join(",") + "\n";
    });

    try {
        await navigator.clipboard.writeText(csvContent);
        alert(`有効な${filtered.length}問をコピーしました。\n（改行は「邺」に戻しました）`);
    } catch(e) {
        alert("コピー失敗");
    }
}

/* ---- ログのExport/Import ---- */
exportStatsBtn.addEventListener("click", () => {
    const stats = loadStats();
    const memos = loadMemos();
    const deleted = loadDeleted();
    const exportObj = { stats: stats, deleted: deleted, memos: memos };
    const blob = new Blob([JSON.stringify(exportObj, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "rccm_drill_data.json";
    a.click();
    URL.revokeObjectURL(url);
});

importFile.addEventListener("change", (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const imported = JSON.parse(e.target.result);
            const iStats = imported.stats || (imported.correct ? null : imported);
            const iDeleted = imported.deleted || [];
            const iMemos = imported.memos || {};

            if (!confirm("現在の学習ログ・メモを上書きします。よろしいですか？")) return;

            if (iStats && Object.keys(iStats).length) saveStats(iStats);
            if (iDeleted) saveDeleted(iDeleted);
            if (iMemos) saveMemos(iMemos);
            
            alert("データを読み込みました。");
            location.reload(); 
        } catch (err) {
            alert("読み込み失敗: " + err);
        }
    };
    reader.readAsText(file);
    event.target.value = '';
});
