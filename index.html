<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>測量士補・測量士 試験対策システム</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    body { font-family: "Noto Sans JP", sans-serif; }
    /* 解説やメモエリアの初期状態 */
    .hidden { display: none; }
    /* 解答・解説エリアのスタイル */
    .answer-box { background-color: #f0fff4; border: 1px solid #9ae6b4; color: #22543d; }
    .hint-box { background-color: #fffff0; border: 1px solid #fbd38d; color: #744210; }
    .ai-box { background-color: #f3e8ff; border: 1px solid #d6bcfa; color: #553c9a; }
</style>
</head>
<body class="bg-gray-100 text-gray-800">

<div class="container mx-auto p-4 max-w-4xl">
    
    <!-- ▼▼▼ コントロールパネル ▼▼▼ -->
    <div class="bg-white p-4 rounded shadow mb-6">
        <h1 class="text-xl font-bold mb-4 text-blue-800">過去問・演習ドリル</h1>
        <div class="flex flex-wrap gap-4 items-end">
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">年度</label>
                <select id="year-select" class="border rounded p-2 min-w-[100px]"></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">問題セット</label>
                <select id="set-select" class="border rounded p-2 min-w-[150px]"></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">番号</label>
                <select id="qnum-select" class="border rounded p-2 min-w-[80px]"></select>
            </div>
            <button id="start-btn" class="bg-blue-600 text-white font-bold py-2 px-6 rounded hover:bg-blue-700 transition">
                移動
            </button>
        </div>
    </div>

    <!-- ▼▼▼ 問題表示エリア ▼▼▼ -->
    <div id="quiz-container"></div>

    <!-- ▼▼▼ ページ送りボタン ▼▼▼ -->
    <div class="flex justify-between mt-6 px-2">
        <button id="prev-btn" class="bg-gray-500 text-white font-bold py-2 px-6 rounded hover:bg-gray-600 disabled:opacity-50 disabled:cursor-not-allowed">
            &laquo; 前の問題
        </button>
        <button id="next-btn" class="bg-gray-500 text-white font-bold py-2 px-6 rounded hover:bg-gray-600 disabled:opacity-50 disabled:cursor-not-allowed">
            次の問題 &raquo;
        </button>
    </div>

</div>

<!-- ▼▼▼ 問題カードのテンプレート（JSで複製して使います） ▼▼▼ -->
<template id="quiz-card-template">
    <div class="bg-white p-6 rounded shadow-lg border-t-4 border-blue-500">
        <!-- ヘッダー -->
        <div class="flex justify-between items-start mb-4 border-b pb-2">
            <div>
                <h2 id="q-title" class="text-xl font-bold text-gray-900"></h2>
                <p id="q-genre" class="text-sm text-gray-500 mt-1"></p>
            </div>
        </div>

        <!-- 問題文 -->
        <div class="mb-6">
            <p id="q-text" class="text-lg leading-relaxed whitespace-pre-wrap mb-4"></p>
            <img id="q-image" src="" alt="問題画像" class="max-w-full h-auto border rounded hidden mx-auto">
        </div>

        <!-- アクションボタン -->
        <div class="flex flex-wrap gap-2 mb-4">
            <button class="hint-btn bg-yellow-400 text-yellow-900 font-bold py-1 px-4 rounded-full text-sm hover:bg-yellow-500 transition">
                💡 ヒント
            </button>
            <button class="answer-btn bg-red-500 text-white font-bold py-1 px-4 rounded-full text-sm hover:bg-red-600 transition">
                👁️ 解答・解説を表示
            </button>
            <button class="memo-btn bg-blue-100 text-blue-700 font-bold py-1 px-4 rounded-full text-sm hover:bg-blue-200 transition">
                📝 メモ
            </button>
        </div>

        <!-- ヒントエリア -->
        <div id="hint-content" class="hint-box p-4 rounded mb-4 hidden text-sm whitespace-pre-wrap"></div>

        <!-- メモエリア -->
        <div id="memo-content" class="hidden mb-4 bg-blue-50 p-4 rounded border border-blue-200">
            <label class="block text-sm font-bold text-blue-800 mb-1">自分用メモ（ブラウザに保存されます）</label>
            <textarea class="memo-textarea w-full h-24 p-2 border rounded text-sm focus:ring-2 focus:ring-blue-400" placeholder="計算過程や覚え書きなどを入力..."></textarea>
            <div class="text-right mt-2">
                <button class="save-memo-btn bg-blue-600 text-white text-xs font-bold py-1 px-3 rounded hover:bg-blue-700">保存</button>
            </div>
        </div>

        <!-- 解答・解説エリア -->
        <div id="answer-content" class="answer-box p-6 rounded hidden text-gray-800 leading-relaxed"></div>

        <!-- AI対話エリア -->
        <div class="mt-8 pt-4 border-t border-gray-200">
            <h3 class="font-bold text-purple-700 mb-2 flex items-center">
                🤖 AIチューターに相談
            </h3>
            <div class="bg-gray-50 p-4 rounded border border-gray-300">
                <p class="text-xs text-gray-600 mb-2">あなたの解答や疑問を入力してください。AIがアドバイスします。</p>
                <textarea id="user-answer-textarea" class="w-full h-24 p-2 border rounded text-sm mb-2 focus:ring-2 focus:ring-purple-400" placeholder="例：計算してみたら○○になったけど、選択肢と合わない。どこが違う？"></textarea>
                <button class="ai-btn w-full bg-purple-600 text-white font-bold py-2 rounded hover:bg-purple-700 transition shadow">
                    この内容でAIに相談する
                </button>
                <div id="ai-advice-content" class="ai-box mt-4 p-4 rounded hidden text-sm leading-relaxed whitespace-pre-wrap"></div>
            </div>
        </div>
    </div>
</template>

<script>
// =================================================================
// ▼▼▼ 設定エリア：ここにAPIキーを入れてください ▼▼▼
const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE"; 
const GEMINI_MODEL = "gemini-1.5-flash"; // または gemini-2.5-flash
// =================================================================

// -------------------------------------------------------------
// ▼▼▼ 問題データの定義エリア ▼▼▼
// ※外部JSファイルを使わず、ここに直接データを書いても動きます。
// ※以下は動作確認用のサンプルデータです。
// -------------------------------------------------------------

// サンプルデータ（R7 必須問題 No.1）
window.questions_r7_no1 = [
    {
        id: "R7-No1-1",
        year: "令和7年",
        q_set: "必須問題",
        q_num: "No.1",
        genre: ["法規", "測量法"],
        question_text: "測量法（昭和24年法律第188号）の規定に関する次の記述のうち、誤っているものはどれか。",
        answer_text: "3",
        explanation: "3が誤りです。基本測量の測量成果を使用しようとする者は、あらかじめ国土地理院長の承認を得なければなりませんが、測量を実施しようとする場合は承認ではなく「複製」や「使用」の申請が必要です（文脈による）。",
        hint: "「承認」が必要なケースと「届出」で済むケースを区別しましょう。",
        question_image: ""
    },
    {
        id: "R7-No1-2",
        year: "令和7年",
        q_set: "必須問題",
        q_num: "No.2",
        genre: ["多角測量"],
        question_text: "次の文は、トータルステーションを用いた基準点測量について述べたものである...",
        answer_text: "1",
        explanation: "1が正解です。",
        hint: "気象補正の公式を思い出してください。",
        question_image: ""
    }
];

// ★ここに questions_r7_selective などのデータを追記してください★
// window.questions_r7_selective = [ ... ];


// -------------------------------------------------------------
// ▼▼▼ システムロジック ▼▼▼
// -------------------------------------------------------------
document.addEventListener('DOMContentLoaded', () => {

    // DOM要素
    const quizContainer = document.getElementById('quiz-container');
    const quizCardTemplate = document.getElementById('quiz-card-template');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const yearSelect = document.getElementById('year-select');
    const setSelect = document.getElementById('set-select');
    const qnumSelect = document.getElementById('qnum-select');
    const startBtn = document.getElementById('start-btn');

    let allQuestions = [];
    let currentQuestionIndex = 0;

    // 年号の正規化
    function normalizeYear(yearStr) {
        if (!yearStr) return '';
        const match = yearStr.match(/令和(\d+)年/);
        return match ? 'R' + match[1] : yearStr;
    }

    // データ読み込み
    function initializeQuestions() {
        allQuestions = [];
        // ここに読み込みたい変数名をリストアップ
        const datasets = [
            'questions_r7_no1', 'questions_r7_selective',
            'questions_r6_no1', 'questions_r6_selective',
            'questions_r5_no1', 'questions_r5_selective'
        ];

        datasets.forEach(name => {
            if (typeof window[name] !== 'undefined' && Array.isArray(window[name])) {
                allQuestions = allQuestions.concat(window[name]);
            }
        });

        if (allQuestions.length === 0) {
            console.warn("問題データが見つかりません。");
        }

        allQuestions.forEach(q => {
            q.normalizedYear = normalizeYear(q.year);
        });
    }

    // コントロールパネル構築
    function initializeControlPanel() {
        if (allQuestions.length === 0) return;

        const years = [...new Set(allQuestions.map(q => q.normalizedYear))].sort((a, b) => {
            return parseInt(b.slice(1)) - parseInt(a.slice(1));
        });
        
        yearSelect.innerHTML = '';
        years.forEach(y => {
            const opt = document.createElement('option');
            opt.value = y; opt.textContent = y;
            yearSelect.appendChild(opt);
        });

        yearSelect.addEventListener('change', updateSetOptions);
        setSelect.addEventListener('change', updateQNumOptions);
        startBtn.addEventListener('click', jumpToQuestion);

        updateSetOptions();
    }

    function updateSetOptions() {
        const selectedYear = yearSelect.value;
        const sets = [...new Set(allQuestions.filter(q => q.normalizedYear === selectedYear).map(q => q.q_set))];
        sets.sort(); // 必要なら並び替えロジック追加

        setSelect.innerHTML = '';
        sets.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s; opt.textContent = s;
            setSelect.appendChild(opt);
        });
        updateQNumOptions();
    }

    function updateQNumOptions() {
        const y = yearSelect.value;
        const s = setSelect.value;
        const qnums = [...new Set(allQuestions.filter(q => q.normalizedYear === y && q.q_set === s).map(q => q.q_num))];
        
        // 数値順ソート
        qnums.sort((a, b) => {
            const na = parseInt(a.replace(/[^0-9]/g, '')) || 0;
            const nb = parseInt(b.replace(/[^0-9]/g, '')) || 0;
            return na - nb;
        });

        qnumSelect.innerHTML = '';
        qnums.forEach(qn => {
            const opt = document.createElement('option');
            opt.value = qn; opt.textContent = qn;
            qnumSelect.appendChild(opt);
        });
    }

    function jumpToQuestion() {
        const y = yearSelect.value;
        const s = setSelect.value;
        const n = qnumSelect.value;
        const idx = allQuestions.findIndex(q => q.normalizedYear === y && q.q_set === s && q.q_num === n);

        if (idx !== -1) {
            currentQuestionIndex = idx;
            displayQuestion(idx);
        } else {
            alert('該当する問題がありません。');
        }
    }

    // 問題表示
    function displayQuestion(index) {
        quizContainer.innerHTML = '';
        const q = allQuestions[index];
        if (!q) {
            quizContainer.innerHTML = '<div class="p-4 text-red-500">問題データがありません。</div>';
            return;
        }

        const clone = quizCardTemplate.content.cloneNode(true);

        clone.querySelector('#q-title').textContent = `[${q.normalizedYear}] ${q.q_set} ${q.q_num}`;
        clone.querySelector('#q-genre').textContent = (q.genre || []).join(' / ');
        clone.querySelector('#q-text').textContent = q.question_text;

        const img = clone.querySelector('#q-image');
        if (q.question_image) {
            img.src = q.question_image;
            img.classList.remove('hidden');
        }

        // 解答エリア
        const ansContent = clone.querySelector('#answer-content');
        let ansHTML = "";
        if (q.answer) {
            // オブジェクト形式の場合（穴埋めなど）
            ansHTML += "<strong>【正答】</strong><br>";
            for (const [k, v] of Object.entries(q.answer)) ansHTML += `${k}: ${v}<br>`;
        } else {
            ansHTML += `<strong>【正答】</strong> <span class="text-xl font-bold text-red-600">${q.answer_text || q.answer_final || '不明'}</span>`;
        }
        if (q.explanation) ansHTML += `<hr class="my-3 border-green-300"><div class="text-sm">${q.explanation}</div>`;
        ansContent.innerHTML = ansHTML;

        // ヒント
        clone.querySelector('#hint-content').textContent = q.hint || "ヒントはありません。";

        // ボタンイベント
        const cardRoot = clone.querySelector('div'); // root div
        const hintBtn = clone.querySelector('.hint-btn');
        const ansBtn = clone.querySelector('.answer-btn');
        const memoBtn = clone.querySelector('.memo-btn');
        const saveMemoBtn = clone.querySelector('.save-memo-btn');
        const aiBtn = clone.querySelector('.ai-btn');

        const hintEl = clone.querySelector('#hint-content');
        const ansEl = clone.querySelector('#answer-content');
        const memoEl = clone.querySelector('#memo-content');
        const memoTx = clone.querySelector('.memo-textarea');
        const aiResEl = clone.querySelector('#ai-advice-content');
        const userTx = clone.querySelector('#user-answer-textarea');

        hintBtn.onclick = () => hintEl.classList.toggle('hidden');
        ansBtn.onclick = () => ansEl.classList.toggle('hidden');
        memoBtn.onclick = () => memoEl.classList.toggle('hidden');

        // メモ保存
        const memoKey = `memo_${q.normalizedYear}_${q.q_num}`;
        memoTx.value = localStorage.getItem(memoKey) || "";
        saveMemoBtn.onclick = () => {
            localStorage.setItem(memoKey, memoTx.value);
            alert("メモを保存しました");
        };

        // AI機能
        aiBtn.onclick = async () => {
            const input = userTx.value.trim();
            if (!input) {
                alert("質問や解答を入力してください");
                return;
            }
            if (!GEMINI_API_KEY || GEMINI_API_KEY.includes("YOUR")) {
                alert("APIキーが設定されていません。HTMLファイル内のGEMINI_API_KEYを編集してください。");
                return;
            }

            aiBtn.textContent = "AI思考中...";
            aiBtn.disabled = true;
            aiResEl.classList.remove('hidden');
            aiResEl.textContent = "問い合わせ中...";

            try {
                const advice = await getAIAdvice(q, input);
                aiResEl.innerHTML = `<strong>【AI解説】</strong><br>${advice.replace(/\n/g, '<br>')}`;
            } catch (e) {
                aiResEl.textContent = "エラーが発生しました: " + e.message;
            } finally {
                aiBtn.textContent = "この内容でAIに相談する";
                aiBtn.disabled = false;
            }
        };

        quizContainer.appendChild(clone);
        updateNav();
    }

    function updateNav() {
        prevBtn.disabled = (currentQuestionIndex === 0);
        nextBtn.disabled = (currentQuestionIndex >= allQuestions.length - 1);
    }

    prevBtn.onclick = () => { if(currentQuestionIndex > 0) { currentQuestionIndex--; displayQuestion(currentQuestionIndex); }};
    nextBtn.onclick = () => { if(currentQuestionIndex < allQuestions.length - 1) { currentQuestionIndex++; displayQuestion(currentQuestionIndex); }};

    // 初期実行
    initializeQuestions();
    initializeControlPanel();
    if(allQuestions.length > 0) displayQuestion(0);
    else quizContainer.innerHTML = '<div class="p-8 text-center text-gray-500">問題データがロードされていません。<br>HTMLソース内の script タグにデータを追記してください。</div>';
});

// -------------------------------------------------------------
// ▼▼▼ API通信関数 ▼▼▼
// -------------------------------------------------------------
async function getAIAdvice(q, input) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
    
    // 正解テキストの生成
    let correctStr = q.answer_text || "";
    if (!correctStr && q.answer) correctStr = JSON.stringify(q.answer);

    const prompt = `
あなたは測量士国家試験の講師です。以下の問題について、受験生の入力に対してアドバイスしてください。
【問題】${q.question_text}
【正解】${correctStr}
【解説】${q.explanation || "なし"}
【受験生の入力】${input}

指示：
1. 受験生の入力が正しいか、間違っているか判定。
2. 間違いなら、なぜ違うか優しく解説。
3. 学習のポイントを一言。
    `;

    const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });

    if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error?.message || res.statusText);
    }

    const data = await res.json();
    try {
        return data.candidates[0].content.parts[0].text;
    } catch(e) {
        return "AIからの応答を解析できませんでした。";
    }
}
</script>
</body>
</html>
